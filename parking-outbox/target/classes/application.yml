spring:
  application:
    name: parking-outbox
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  cloud:
    gcp:
      credentials:
        enabled: ${GCP_CREDENTIALS_ENABLED:true}
      project-id: ${GCP_PROJECT_ID:}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:parking_db}
    username: ${DB_USER:parking_user}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: OutboxHikariPool
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
  flyway:
    enabled: false
    table: outbox_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
server:
  port: ${PORT:8081}

# Redis / Redisson config
redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  use-tls: ${REDIS_TLS:false}

app:
  pubsub:
    topic: ${PUBSUB_TOPIC:reservation.created}
    subscription: ${PUBSUB_SUBSCRIPTION:reservation-created-sub}

logging:
  level:
    com.parking: DEBUG
    org.springframework: INFO
