spring:
  application:
    name: parking-outbox
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  cloud:
    gcp:
      credentials:
        enabled: ${GCP_CREDENTIALS_ENABLED:true}
      project-id: ${GCP_PROJECT_ID:}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:parking_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: OutboxHikariPool
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
server:
  port: ${PORT:8081}

app:
  pubsub:
    topic: ${PUBSUB_TOPIC:reservation.created}
    subscription: ${PUBSUB_SUBSCRIPTION:reservation-created-sub}

logging:
  level:
    com.parking: DEBUG
    org.springframework: INFO
