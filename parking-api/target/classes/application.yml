spring:
  application:
    name: parking-api

  threads:
    virtual:
      enabled: false  # Disabled — Redisson locks incompatible with Virtual Threads

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  cloud:
    gcp:
      credentials:
        enabled: ${GCP_CREDENTIALS_ENABLED:true}
      project-id: ${GCP_PROJECT_ID:}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:parking_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10       # 6 instances × 10 = 60 connections → Cloud SQL safe
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: ParkingHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 200
      min-spare: 10

# Redis / Redisson config
redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  use-tls: ${REDIS_TLS:false}

# JWT config
app:
  jwt:
    secret: ${JWT_SECRET:${JWT_SECRET_KEY:ThisIsAVeryLongSecretKeyForLocalDevelopmentAtLeast256BitsLong!}}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24h
    kms:
      enabled: ${JWT_KMS_ENABLED:false}
      key-version: ${JWT_KMS_KEY_VERSION:}
      typ: ${JWT_TYP:JWT}
  parking:
    total-spaces: 80
    price-per-day: 10.00
    lock-ttl-seconds: 30
  local-mode: ${APP_LOCAL_MODE:true}  # Dùng mock thay vì GCP services
  reserve:
    cache-lock-wait-seconds: ${RESERVE_CACHE_LOCK_WAIT_SECONDS:0}
    cache-lock-lease-seconds: ${RESERVE_CACHE_LOCK_LEASE_SECONDS:5}
  pubsub:
    topic: ${PUBSUB_TOPIC:reservation.created}
    subscription: ${PUBSUB_SUBSCRIPTION:reservation-created-sub}
    publish-timeout-seconds: ${PUBSUB_PUBLISH_TIMEOUT_SECONDS:5}
    ordering-enabled: ${APP_PUBSUB_ORDERING_ENABLED:false}
    warmup-enabled: ${APP_PUBSUB_WARMUP_ENABLED:true}
    bootstrap-enabled: ${APP_PUBSUB_BOOTSTRAP_ENABLED:true}
    enabled: ${APP_PUBSUB_ENABLED:true}

logging:
  level:
    com.parking: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
