spring:
  application:
    name: parking-worker
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  cloud:
    gcp:
      credentials:
        enabled: ${GCP_CREDENTIALS_ENABLED:false}
      project-id: ${GCP_PROJECT_ID:local-project}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:parking_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 30
      connection-timeout: 1000   # 1s — 80 messages × ~200ms processing → max wait ~400ms < 1s
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: WorkerHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
  flyway:
    enabled: false
    table: worker_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

server:
  port: ${PORT:8082}

# Redis / Redisson config
redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  use-tls: ${REDIS_TLS:false}

app:
  pubsub:
    subscription: ${PUBSUB_SUBSCRIPTION:reservation-created-sub}
    pull-enabled: ${PUBSUB_PULL_ENABLED:false}  # false = PUSH mode, true = PULL mode

logging:
  level:
    com.parking: DEBUG
    org.springframework: INFO
